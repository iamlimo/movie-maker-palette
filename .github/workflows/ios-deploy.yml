name: iOS Deploy (App Store)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  build-and-deploy:
    name: Build and Deploy iOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1

      - name: Cache bundler
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('ios/fastlane/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Install dependencies
        working-directory: ios/fastlane
        run: |
          gem install bundler --conservative
          bundle config set path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update

      - name: Ensure App Store Connect API key file
        run: |
          set -e
          # Prefer checked-in AuthKey_*.p8, then raw secret, then base64 secret
          if ls ios/fastlane/AuthKey_*.p8 1> /dev/null 2>&1; then
            cp ios/fastlane/AuthKey_*.p8 ios/fastlane/AuthKey.p8
            chmod 0600 ios/fastlane/AuthKey.p8
            echo "Using checked-in App Store Connect key"
          elif [ -n "${{ secrets.APP_STORE_CONNECT_KEY }}" ]; then
            printf '%s\n' "${{ secrets.APP_STORE_CONNECT_KEY }}" > ios/fastlane/AuthKey.p8
            chmod 0600 ios/fastlane/AuthKey.p8
            echo "Wrote key from APP_STORE_CONNECT_KEY secret"
          elif [ -n "${{ secrets.APP_STORE_CONNECT_KEY_B64 }}" ]; then
            echo "${{ secrets.APP_STORE_CONNECT_KEY_B64 }}" | base64 --decode > ios/fastlane/AuthKey.p8
            chmod 0600 ios/fastlane/AuthKey.p8
            echo "Wrote key from APP_STORE_CONNECT_KEY_B64 secret (base64)"
          else
            echo "No App Store Connect key found (checked-in or secret). Exiting.";
            exit 1
          fi

      - name: Run Fastlane release lane
        working-directory: ios/fastlane
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_TEAM_ID: ${{ secrets.APP_STORE_TEAM_ID }}
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          XCODE_WORKSPACE: "../App/App.xcworkspace"
          XCODE_SCHEME: "App"
        run: |
          bundle exec fastlane ios release
